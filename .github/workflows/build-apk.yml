name: 打包并发布 APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少签名密钥：请在仓库 Settings > Secrets 里添加 KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 编译 APK（正式签名）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: caipiao
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理文件
        run: cp app/build/outputs/apk/release/app-release.apk caipiao-helper.apk

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 福彩体彩助手 1.0.${{ github.run_number }}
          body: ${{ github.event.head_commit.message || '手动发布' }}
          files: caipiao-helper.apk
          make_latest: true

      - name: 同时保存一份到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caipiao-helper-apk
          path: caipiao-helper.apk
