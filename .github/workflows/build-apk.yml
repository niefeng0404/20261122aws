name: 打包并发布 APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 计算版本号（每位 0-9，满 10 进位：1.0.9 → 1.1.0）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          if [[ "$LAST" =~ ^v([0-9])\.([0-9])\.([0-9])$ ]]; then
            N=$(( BASH_REMATCH[1]*100 + BASH_REMATCH[2]*10 + BASH_REMATCH[3] + 1 ))
          else
            N=110
          fi
          NAME="$(( N / 100 )).$(( N / 10 % 10 )).$(( N % 10 ))"
          echo "上一个版本：$LAST  新版本：$NAME"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 准备签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少签名密钥：请在仓库 Settings > Secrets 里添加 KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: 编译 APK（正式签名）
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: caipiao
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: 整理文件
        run: |
          cp app/build/outputs/apk/release/app-release.apk caipiao-helper.apk
          echo "{\"code\": $VERSION_CODE, \"name\": \"$VERSION_NAME\"}" > version.json
          cat version.json

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: 福彩体彩助手 ${{ env.VERSION_NAME }}
          body: ${{ github.event.head_commit.message || '手动发布' }}
          files: |
            caipiao-helper.apk
            version.json
          make_latest: true

      - name: 同时保存一份到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: caipiao-helper-apk
          path: caipiao-helper.apk
